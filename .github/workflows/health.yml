name: health
on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 09:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Run checks
        run: |
          set -u
          problems=""
          add() { problems="${problems}- $1"$'\n'; }

          # 1. latest GitHub release vs npm, and its four assets
          tag=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          npm_latest=$(curl -fsS https://registry.npmjs.org/paper-claude-switch | jq -r '."dist-tags".latest')
          [ "v$npm_latest" = "$tag" ] || add "npm latest is **$npm_latest** but the latest release is **$tag**"
          for a in paper-claude-switch-windows-x64.exe paper-claude-switch-macos-x64 paper-claude-switch-macos-arm64 paper-claude-switch-linux-x64; do
            gh api "repos/$REPO/releases/latest" --jq '.assets[].name' | grep -qx "$a" || add "release $tag is missing asset \`$a\`"
          done

          # 2. latest runs on main
          for wf in ci release; do
            c=$(gh api "repos/$REPO/actions/workflows/$wf.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')
            [ "$c" = "success" ] || add "latest \`$wf\` run concluded **$c**"
          done

          # 3. open bug reports
          n=$(gh api "repos/$REPO/issues?state=open&labels=bug&per_page=100" --jq 'length')
          [ "$n" -eq 0 ] || add "$n open bug report(s)"

          echo "release=$tag npm=$npm_latest"
          if [ -z "$problems" ]; then echo "ALL GOOD"; exit 0; fi
          printf 'Weekly health check found:\n\n%s\nRun: %s/%s/actions/runs/%s\n' "$problems" "$GITHUB_SERVER_URL" "$REPO" "$GITHUB_RUN_ID" > body.md
          gh label create -R "$REPO" health --color D93F0B --description "weekly health check" --force >/dev/null
          existing=$(gh issue list -R "$REPO" --label health --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment -R "$REPO" "$existing" --body-file body.md; else gh issue create -R "$REPO" --title "Weekly health check needs attention" --label health --body-file body.md; fi
          echo "$problems"
          exit 0
